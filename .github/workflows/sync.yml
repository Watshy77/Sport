name: Synchro Garmin et publication

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h (UTC)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install -r sync/requirements.txt

      - name: Récupérer Garmin Connect
        env:
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: python sync/garmin_sync.py

      - name: Enregistrer les données chiffrées
        run: |
          git config user.name "allure-sync"
          git config user.email "allure-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Synchro Garmin $(date -u +%F_%H:%M)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
