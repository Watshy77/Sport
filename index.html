<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allure">
<meta name="theme-color" content="#c6402a">
<title>Allure coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a personal coach you open every morning, clear and encouraging
   IDEA a training logbook printed on athletics-track tartan: lanes, bib numbers, the day's session pinned on top
   PICTURE today's session as a big tartan card with its structure, beside a form dial (fitness minus fatigue)
   COLOUR white ground, tartan red for running, deep road blue for cycling, ink asphalt; night = asphalt ground
   TYPE Barlow Condensed (bib numerals) + Barlow
   LAYOUT laptop: session card left, dial + week meter right, week list below; phone: card, dial, week, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111213);--ink:light-dark(#16181a,#eceae6);--mut:light-dark(#5b6066,#a0a4a9);--panel:light-dark(#f1efeb,#1c1e20);--line:light-dark(#dcd9d3,#2e3134);--run:light-dark(#c6402a,#e0603f);--bike:light-dark(#1d5fd1,#5b8ff0);--ok:light-dark(#2a7f49,#4cbf72);--warn:light-dark(#b07800,#e0aa2a);--rest:light-dark(#2a2d30,#2a2d30)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(34px,6vw,50px)}
h2{font-size:28px;margin-bottom:12px}
h3{font-size:21px}
p{margin:0 0 10px}
.band{padding:clamp(18px,3vw,40px) max(4vw,16px,env(safe-area-inset-right,0px)) clamp(18px,3vw,40px) max(4vw,16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(4vw,16px) 10px;border-bottom:1px solid var(--line)}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px}
.btn{font:600 16px Barlow,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--run);border-color:var(--run);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--bike);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current=page]{color:var(--run)}
.demo{background:var(--panel);border-bottom:1px solid var(--line);font-size:15px}
.demo .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch}
.card{border-radius:18px;padding:22px;position:relative;overflow:hidden}
.today{color:#fff;background:var(--run);display:flex;flex-direction:column;gap:14px;min-height:340px}
.today.bike{background:var(--bike)}
.today.rest{background:var(--rest)}
.today>*{position:relative}
.lanes{position:absolute!important;inset:0;opacity:.16;pointer-events:none}
.kick{font-size:15px;font-weight:600;opacity:.92}
.big{font-size:clamp(52px,9vw,84px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;align-items:baseline;background:rgba(0,0,0,.16);border-radius:10px;padding:9px 12px}
.steps b{font-family:"Barlow Condensed",sans-serif;font-size:22px;white-space:nowrap}
.steps small{display:block;opacity:.9;font-size:14px}
.why{font-size:15px;background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
.why p{margin:0 0 4px}
.side{display:grid;gap:20px;align-content:start}
.panel{background:var(--panel);border-radius:18px;padding:18px}
.dial{position:relative;max-width:300px;margin:0 auto}
.dial svg{width:100%;display:block}
.dial .v{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.dial .v .num{font-size:44px}
.muted{color:var(--mut)}
.small{font-size:14px}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--run);border-radius:7px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin-top:10px}
.kv .num{font-size:30px}
.week{display:grid;gap:8px}
.day{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.day.now{border:2px solid var(--ink)}
.day .dn{font-weight:600}
.day .dn small{display:block;color:var(--mut);font-weight:500}
.day .ti{font-weight:600}
.day .ti small{display:block;color:var(--mut);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--panel)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.miss{background:color-mix(in srgb,var(--run) 15%,transparent);color:var(--run)}
.chip.plan{background:color-mix(in srgb,var(--bike) 14%,transparent);color:var(--bike)}
details.day{display:block}
details.day summary{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day .det{margin:10px 0 0 calc(5.6em + 12px);font-size:15px}
details.day .det li{margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border-radius:14px;padding:14px}
.kpi .num{font-size:38px}
.kpi small{display:block;color:var(--mut)}
.fig{position:relative;min-height:320px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font:13px Barlow,system-ui,sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:4px;fill:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:20px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.cols .c i{display:block;width:100%}
.cols .c span{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:var(--mut)}
.cols .c .lab{bottom:-22px}
.cols .c .val{font-size:13px;color:var(--ink);font-weight:600}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:15px}
.row .bar{height:22px;background:var(--line);border-radius:6px;overflow:hidden}
.row .bar i{display:block;height:100%}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:14px}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:14px 18px}
label.l{display:grid;gap:5px;font-weight:600;font-size:15px}
label.l small{font-weight:400;color:var(--mut)}
input,select{font:16px Barlow,system-ui,sans-serif;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=range]{padding:0;accent-color:var(--run)}
input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--run)}
.daysel{display:flex;flex-wrap:wrap;gap:8px}
.daysel label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:18px;padding:24px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--run);background:color-mix(in srgb,var(--run) 6%,transparent)}
.acts{display:grid;gap:8px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.act .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.act .ic svg{width:24px;height:24px}
.act .st{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:22px;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.help ol{padding-left:20px;margin:6px 0 12px}
.help li{margin-bottom:6px}
textarea{width:100%;min-height:120px;font:13px ui-monospace,monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:12px}
.sp{background:var(--panel);border-radius:14px;padding:14px}
.sp .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sp .num{font-size:32px}
.sp .fig{min-height:70px;margin-top:6px}
.rec{display:grid;gap:6px;margin-top:6px}
.rec div{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.rec b{font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.day,details.day summary{grid-template-columns:4.2em minmax(0,1fr) auto;gap:8px}details.day .det{margin-left:0}.row{grid-template-columns:6em minmax(0,1fr) 4em}table{font-size:13px}th,td{padding:6px 4px}.card{padding:18px}.top .btn span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes sweep{from{transform:rotate(-90deg)}}
.needle{transform-origin:100px 100px;animation:sweep .9s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--run)"/><path d="M7 23c4-10 10-14 18-14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M7 27c5-9 11-12 18-12" stroke="#fff" stroke-width="1.5" fill="none" opacity=".6" stroke-linecap="round"/></svg>Allure</div>
  <button class="btn pri" id="imp-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Importer</span></button>
  <input type="file" id="file" multiple hidden>
  <input type="file" id="bk-file" hidden>
</header>
<div id="demo"></div>
<main id="v"></main>
<nav class="tabs" aria-label="Sections">
  <a href="#coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Coach</a>
  <a href="#stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</a>
  <a href="#activites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Activités</a>
  <a href="#profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<script>
{
/* ============ utilitaires ============ */
const DAY=864e5, KEY='allure.v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const startDay=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(ms,n)=>{const d=new Date(ms);d.setDate(d.getDate()+n);d.setHours(0,0,0,0);return d.getTime()};
const monday=ms=>{const d=new Date(startDay(ms));return addDays(d.getTime(),-((d.getDay()+6)%7))};
const dk=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nf1=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
const nf0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const km=m=>nf1.format(m/1000)+' km';
const hm=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return h?h+' h '+String(m).padStart(2,'0'):m+' min'};
const pace=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clock=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const DN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'], DNL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const dshort=ms=>{const d=new Date(ms);return d.getDate()+' '+MO[d.getMonth()]};
const parsePace=t=>{const m=String(t).trim().match(/^(\d{1,2})[:'h](\d{1,2})/);return m?(+m[1])*60+(+m[2]):null};

/* ============ état ============ */
function defProfile(){return{sex:'m',age:35,hrMax:186,hrRest:52,ftp:230,thrPace:285,level:'inter',goal:'semi',goalDate:dk(addDays(Date.now(),70)),days:[1,3,5,6],hours:6,runShare:60}}
let S=null;
function loadState(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Stockage indisponible : pense à exporter une sauvegarde (Profil).')}}

/* ============ charge, forme ============ */
function trimpF(hr,p){const r=clamp((hr-p.hrRest)/Math.max(1,p.hrMax-p.hrRest),0,1.1);return r*0.64*Math.exp((p.sex==='f'?1.67:1.92)*r)}
function loadOf(a,p){
  const h=a.dur/3600;
  if(a.sport==='bike'&&(a.np||a.avgPw)&&p.ftp){const IF=(a.np||a.avgPw*1.05)/p.ftp;return h*IF*IF*100}
  const norm=3600*trimpF(0.9*p.hrMax,p);
  if(a.hrHist){let t=0;for(const k in a.hrHist)t+=a.hrHist[k]*trimpF(+k,p);return t/norm*100}
  if(a.avgHr)return a.dur*trimpF(a.avgHr,p)*1.06/norm*100;
  if(a.sport==='run'&&a.dist&&p.thrPace){const IF=(a.dist/a.dur)/(1000/p.thrPace);return h*IF*IF*100}
  return h*45;
}
function series(p,until){
  const loads={};for(const a of S.acts){const k=dk(a.start);loads[k]=(loads[k]||0)+loadOf(a,p)}
  const first=S.acts.length?startDay(Math.min(...S.acts.map(a=>a.start))):startDay(until);
  let seed=0;for(let i=0;i<28;i++)seed+=loads[dk(addDays(first,i))]||0;seed/=28;
  let ctl=seed,atl=seed;const out=[];
  for(let d=first;d<=until;d=addDays(d,1)){const k=dk(d),L=loads[k]||0;out.push({d,k,L,ctl,atl,tsb:ctl-atl});ctl+=(L-ctl)/42;atl+=(L-atl)/7}
  return out;
}
function formZone(t){return t<-30?['Surcharge','var(--run)','Risque de blessure : lève le pied.']:t<-10?['Productif','var(--bike)','Tu encaisses bien la charge : c\'est là que tu progresses.']:t<5?['Neutre','var(--mut)','Ni fatigué ni frais : semaine standard.']:t<25?['Frais','var(--ok)','Idéal pour une séance clé ou une course.']:['Désentraînement','var(--warn)','Très frais, mais ta forme baisse : reprends du volume.']}

/* ============ plan ============ */
const HARD=new Set(['seuil','vma','sst','vo2']);
const RATE={run:{easy:55,recup:40,long:60,seuil:80,vma:85,race:95,activ:50},bike:{easy:50,recup:35,long:55,sst:75,vo2:82,race:70,activ:45}};
const NAMES={run:{easy:'Footing endurance',recup:'Footing récupération',long:'Sortie longue',seuil:'Seuil',vma:'Fractionné VMA',race:'Course objectif',activ:'Footing d\'activation'},bike:{easy:'Endurance vélo',recup:'Vélo récupération',long:'Sortie longue vélo',sst:'Sweet spot',vo2:'Intervalles VO2max',race:'Cyclo objectif',activ:'Vélo d\'activation'}};
const W={long:1.7,seuil:1.25,vma:1.2,sst:1.25,vo2:1.2,easy:1,recup:.6,activ:.45};
const LONGMAX={run:{none:105,'10k':90,semi:120,marathon:165,cyclo:80},bike:{none:210,'10k':150,semi:150,marathon:150,cyclo:300}};
const MAXD={run:{easy:70,recup:40,seuil:75,vma:70,activ:35},bike:{easy:120,recup:50,sst:95,vo2:85,activ:50}};
const GOALS={none:'Sans objectif','10k':'10 km',semi:'Semi-marathon',marathon:'Marathon',cyclo:'Cyclosportive'};
const avail=p=>(p.days&&p.days.length?p.days:[1,3,5,6]).slice().sort((a,b)=>a-b);
function clampDur(d,m,p){const mx=d.type==='long'?LONGMAX[d.sport][p.goal]:(MAXD[d.sport][d.type]||90);const mn=(d.type==='recup'||d.type==='activ')?20:d.type==='long'?(d.sport==='bike'?60:45):30;return Math.round(clamp(m,mn,mx)/5)*5}
function riegel(p,D){const d1=3600/p.thrPace*1000;return 3600*Math.pow(D/d1,1.06)}
const GOALD={'10k':10000,semi:21097,marathon:42195};
function weekInfo(mon,p){
  if(p.goal!=='none'&&p.goalDate){const gd=new Date(p.goalDate+'T12:00').getTime();const w=Math.round((monday(gd)-mon)/(7*DAY));
    if(w===0)return{kind:'race',f:.5,label:'Semaine de l\'objectif',w,gd};
    if(w===1)return{kind:'taper',f:.65,label:'Affûtage : dernière semaine avant l\'objectif',w};
    if(w===2)return{kind:'taper',f:.85,label:'Début d\'affûtage',w};
    if(w>2)return w%4===0?{kind:'rec',f:.7,label:'Semaine allégée pour assimiler',w}:{kind:'build',f:1,label:'Semaine de développement',w};
  }
  return Math.floor(mon/(7*DAY))%4===3?{kind:'rec',f:.7,label:'Semaine allégée pour assimiler'}:{kind:'build',f:1,label:'Semaine de développement'};
}
function skeleton(mon,p,wi){
  const av=avail(p),share=p.runShare/100;
  const days=Array.from({length:7},(_,i)=>({i,date:addDays(mon,i),sport:null,type:'rest'}));
  const both=share>0&&share<1,main=share>=.5?'run':'bike';
  const we=av.filter(i=>i>=5);

function fitChart(svg,ser){const data=ser.slice(-120);
  const draw=()=>{const Wd=svg.clientWidth,Hd=svg.clientHeight;if(!Wd||data.length<2)return;const narrow=Wd<520,m={l:8,r:narrow?84:120,t:16,b:24},h1=(Hd-m.t-m.b)*.66,gap=14,h2=Hd-m.t-m.b-h1-gap;
    const mx=Math.max(20,...data.map(d=>Math.max(d.ctl,d.atl)))*1.12,x=i=>m.l+i*(Wd-m.l-m.r)/(data.length-1),y=v=>m.t+h1-v/mx*h1,y0=m.t+h1+gap+h2/2,ys=v=>y0-clamp(v,-40,40)/40*(h2/2);
    let area=`M${x(0)} ${y(0)}`+data.map((d,i)=>` L${x(i).toFixed(1)} ${y(d.ctl).toFixed(1)}`).join('')+` L${x(data.length-1)} ${y(0)} Z`;
    const ctlL=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d.ctl).toFixed(1)).join(' ');
    const atl=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d.atl).toFixed(1)).join(' ');
    const bw=Math.max(1,(Wd-m.l-m.r)/data.length-1);
    const bars=data.map((d,i)=>{const z=formZone(d.tsb);const a=ys(Math.max(0,d.tsb)),b=ys(Math.min(0,d.tsb));return`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${a.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,b-a).toFixed(1)}" fill="${z[1]}"/>`}).join('');
    const ticks=data.map((d,i)=>new Date(d.d).getDate()===1?`<text x="${x(i)}" y="${Hd-6}" text-anchor="middle" fill="var(--mut)">${MO[new Date(d.d).getMonth()]}</text><line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t+h1}" stroke="var(--line)"/>`:'').join('');
    const L=data[data.length-1];let yc=y(L.ctl),ya=y(L.atl);if(Math.abs(yc-ya)<34){if(yc<ya){yc-=17-(ya-yc)/2;ya=yc+34}else{ya-=17-(yc-ya)/2;yc=ya+34}}
    svg.innerHTML=`${ticks}<path d="${area}" fill="color-mix(in srgb,var(--bike) 22%,transparent)"/><path d="${ctlL}" fill="none" stroke="var(--bike)" stroke-width="2.5"/><path d="${atl}" fill="none" stroke="var(--run)" stroke-width="1.6"/>
    <line x1="${m.l}" x2="${Wd-m.r}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>${bars}
    <text x="${Wd-m.r+8}" y="${yc+4}" fill="var(--bike)" font-weight="600">${narrow?'Cond.':'Condition'} ${Math.round(L.ctl)}</text>
    <text x="${Wd-m.r+8}" y="${ya+4}" fill="var(--run)" font-weight="600">Fatigue ${Math.round(L.atl)}</text>
    <text x="${Wd-m.r+8}" y="${y0+4}" font-weight="600">Forme ${L.tsb>0?'+':''}${Math.round(L.tsb)}</text>`};
  const ro=new ResizeObserver(draw);ro.observe(svg);draw()}

  const rec=(k,lab,f)=>b[k]?`<tr><td>${lab}</td><td class="n">${f(b[k].v)}</td><td class="n">${dshort(b[k].a.start)} ${new Date(b[k].a.start).getFullYear()}</td></tr>`:'';

    <p class="muted">${ramp>8?'Attention : une hausse de plus de 8 points par semaine augmente le risque de blessure.':'Une hausse de 3 à 6 points par semaine est une progression saine.'}</p>

  </div></div>
  <div class="band" style="padding-top:0"><div class="wrap grid2">
    <section class="panel"><h3>Heures par semaine</h3><p class="small muted"><span class="dot" style="background:var(--run)"></span>Course · <span class="dot" style="background:var(--bike)"></span>Vélo · <span class="dot" style="background:var(--mut)"></span>Autre — ${nf1.format(wk[wk.length-1].km)} km de course cette semaine</p><div class="cols">${cols}</div><div style="height:26px"></div></section>
    <section class="panel"><h3>Intensité sur 28 jours</h3><p class="small muted">${easy>=75?'Bonne polarisation : '+Math.round(easy)+' % du temps en zones faciles.':'Seulement '+Math.round(easy)+' % en zones faciles : vise environ 80 % pour progresser sans t\'user.'}</p><div class="rows">${z.map((v,i)=>`<div class="row"><span>${zl[i]}</span><span class="bar"><i style="width:${v/zt*100}%;background:${zc[i]}"></i></span><span class="r">${Math.round(v/zt*100)} %</span></div>`).join('')}</div><p class="small muted" style="margin-top:10px">Zones en % de ta FC max (${p.hrMax} bpm) : Z2 jusqu'à ${Math.round(p.hrMax*.78)} bpm, seuil dès ${Math.round(p.hrMax*.86)} bpm.</p></section>

      <h3 style="margin-top:18px">Cette année</h3><div class="kv" style="text-align:left"><div><div class="num">${nf0.format(ya.filter(a=>a.sport==='run').reduce((s,a)=>s+(a.dist||0),0)/1000)}</div><small class="muted">km course</small></div><div><div class="num">${nf0.format(ya.filter(a=>a.sport==='bike').reduce((s,a)=>s+(a.dist||0),0)/1000)}</div><small class="muted">km vélo</small></div><div><div class="num">${nf0.format(ya.reduce((s,a)=>s+(a.elev||0),0))}</div><small class="muted">m de D+</small></div></div></section>

const HM=[['ready','Préparation','/100','Score Garmin du matin : sommeil, VFC, charge récente.'],['hrv','VFC nocturne',' ms','Plus haut que ta normale = bien récupéré.'],['rhr','FC au repos',' bpm','Une hausse de 5 bpm ou plus signale fatigue ou maladie.'],['sleep','Score de sommeil','/100',''],['bbWake','Body Battery au réveil','',''],['stress','Stress moyen','','']];
function healthHTML(){if(!S.well||!Object.keys(S.well).length)return`<div class="band" style="padding-top:0"><div class="wrap"><section class="panel"><h3>Santé et récupération</h3><p class="muted small" style="margin:0">Active la synchronisation Garmin (Profil) pour voir ici ta VFC, ton sommeil, ta Body Battery et ta préparation, et pour que le coach en tienne compte.</p></section></div></div>`;

function sparkline(svg,data){const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;const pts=data.map((d,i)=>[i,d.v]).filter(p=>p[1]!=null);if(pts.length<2){svg.innerHTML='';return}
  const vs=pts.map(p=>p[1]),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1,x=i=>4+i*(W-8)/(data.length-1),y=v=>H-6-(v-mn)/r*(H-12);
  const path=pts.map((p,j)=>(j?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' '),l=pts[pts.length-1];
  svg.innerHTML=`<path d="${path}" fill="none" stroke="var(--bike)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(l[0])}" cy="${y(l[1])}" r="3.5" fill="var(--run)"/>`};

   <p class="small" style="margin-top:10px">${S.sync&&S.sync.last?'Dernières données Garmin : '+esc(new Date(S.sync.last).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})):'Pas encore synchronisé.'}${S.sync&&S.sync.err?' <span style="color:var(--run)">Erreur : '+esc(S.sync.err)+'</span>':''}</p>
   <button class="btn pri" type="button" id="sy-go">Synchroniser maintenant</button></div>
  <div class="panel" style="margin-top:20px"><h3>Sauvegarde</h3><p class="small muted">Tes données sont stockées dans ce navigateur uniquement. Exporte une sauvegarde de temps en temps.</p>
   <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn" type="button" id="bk-exp">Exporter la sauvegarde</button><button class="btn" type="button" id="bk-copy">Copier la sauvegarde</button><button class="btn" type="button" id="bk-imp">Restaurer</button><button class="btn" type="button" id="wipe">Tout effacer</button></div>
   <div id="wipe-c" hidden style="margin-top:12px"><p><b>Effacer toutes tes activités et ton profil ?</b></p><button class="btn pri" type="button" id="wipe-y">Oui, effacer</button> <button class="btn" type="button" id="wipe-n">Annuler</button></div></div>
  </div></div>`}

function route(){const h=(location.hash||'#coach').slice(1),v=['coach','stats','activites','profil'].includes(h)?h:'coach';
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const ib=$('#imp-btn');if(ib){const on=!!(S.sync&&S.sync.pass);ib.dataset.mode=on?'sync':'imp';ib.querySelector('span').textContent=on?'Synchro':'Importer'}
  $('#demo').innerHTML=S.sample?`<div class="demo band" style="padding-block:10px"><div class="wrap"><span>Tu vois des <b>données d'exemple</b>. Importe tes fichiers Garmin pour les remplacer, puis règle ton profil.</span><button class="btn" type="button" id="imp3">Importer</button></div></div>`:'';
  let after=null,html;
  if(v==='coach')html=viewCoach();else if(v==='stats'){[html,after]=viewStats()}else if(v==='activites')html=viewActs();else html=viewProfil();
  $('#v').innerHTML=html;if(after)after();window.scrollTo(0,0)}

async function handleFiles(files){if(!files||!files.length)return;let n=0;toast('Lecture en cours…');const out=[];let fail=0;
  for(const f of files){try{await parseAny(f.name,new Uint8Array(await f.arrayBuffer()),out,()=>{n++;if(n%25===0)toast(n+' fichiers lus…')})}catch(e){fail++}}
  if(!out.length){toast(fail?'Fichier non reconnu. Formats acceptés : .FIT, .GPX, .TCX, .CSV, .zip.':'Aucune activité trouvée dans ces fichiers.');return}
  if(S.sample){S.acts=[];S.sample=false}
  const r=merge(out);save();route();
  toast(`${r.added} activité${r.added>1?'s':''} ajoutée${r.added>1?'s':''}${r.upd?', '+r.upd+' complétée'+(r.upd>1?'s':''):''}${r.dup?', '+r.dup+' doublon'+(r.dup>1?'s':''):''}${fail?', '+fail+' fichier(s) illisible(s)':''}.`)}

function readSync(){const p=document.getElementById('sy-pass'),u=document.getElementById('sy-url');if(!p)return;S.sync=Object.assign(S.sync||{},{pass:p.value,url:u.value.trim()||'data/'});save()}
function readProfile(){const p=S.profile,g=id=>document.getElementById(id);if(!g('p-hrMax'))return;
  p.sex=g('p-sex').value;p.hrMax=clamp(+g('p-hrMax').value||p.hrMax,120,230);p.hrRest=clamp(+g('p-hrRest').value||p.hrRest,30,100);
  const tp=parsePace(g('p-thr').value);if(tp)p.thrPace=clamp(tp,150,600);p.ftp=clamp(+g('p-ftp').value||p.ftp,50,600);
  p.level=g('p-level').value;p.goal=g('p-goal').value;p.goalDate=g('p-goalDate').value;p.hours=clamp(+g('p-hours').value||p.hours,1,30);
  p.runShare=+g('p-share').value;g('sh-v').textContent=p.runShare+' % course';
  const ds=DN.map((_,i)=>i).filter(i=>g('p-d'+i).checked);p.days=ds.length?ds:p.days;save()}

async function exportBk(){const data=JSON.stringify(S),fn='allure-sauvegarde-'+dk(Date.now())+'.json';
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:new Blob([data],{type:'application/json'})});return}}catch(e){toast('Téléchargement refusé : utilise « Copier la sauvegarde ».');return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Téléchargement impossible ici : utilise « Copier la sauvegarde ».')}}

function boot(){
  S=loadState();
  if(!S||!S.profile){const p=defProfile();S={profile:p,acts:sampleActs(p),sample:true};}
  S.profile=Object.assign(defProfile(),S.profile);S.acts=S.acts||[];
  const fi=$('#file');
  document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-del]');if(!t)return;const id=t.id;
    if(id==='imp-btn'&&t.dataset.mode==='sync')syncGarmin(true);
    else if(id==='imp-btn'||id==='imp2'||id==='imp3')fi.click();
    else if(id==='sy-go'){readSync();syncGarmin(true)}
    else if(t.dataset.del){S.acts=S.acts.filter(a=>a.id!==t.dataset.del);save();route();toast('Activité supprimée.')}
    else if(id==='more'){S.showN=(S.showN||40)+60;route()}
    else if(id==='apply-est'){Object.assign(S.profile,estimate());save();route();toast('Profil mis à jour.')}
    else if(id==='bk-exp')exportBk();
    else if(id==='bk-copy'){try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Sauvegarde copiée : colle-la dans Notes.')}catch(err){toast('Copie refusée par le navigateur.')}}
    else if(id==='bk-imp')$('#bk-file').click();
    else if(id==='wipe')$('#wipe-c').hidden=false;
    else if(id==='wipe-n')$('#wipe-c').hidden=true;
    else if(id==='wipe-y'){S={profile:defProfile(),acts:[],sample:false};save();route();toast('Tout est effacé.')}});
  fi.addEventListener('change',()=>{handleFiles([...fi.files]);fi.value=''});
  $('#bk-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.profile||!Array.isArray(j.acts))throw 0;S=j;save();route();toast('Sauvegarde restaurée : '+S.acts.length+' activités.')}catch(err){toast('Ce fichier n\'est pas une sauvegarde Allure.')}e.target.value=''});
  document.addEventListener('input',e=>{if(e.target.closest('#pf'))readProfile();if(e.target.closest('#syf'))readSync()});
  document.addEventListener('change',e=>{if(e.target.closest('#pf'))readProfile()});
  document.addEventListener('submit',e=>{if(e.target.id!=='man')return;e.preventDefault();const g=id=>document.getElementById(id);const d=new Date(g('m-d').value+'T12:00').getTime(),t=+g('m-t').value*60,k=+g('m-k').value,h=+g('m-h').value;
    if(!d||!t){toast('Indique au moins la date et la durée.');return}const a=build({sport:g('m-s').value,start:d,dur:t,dist:k?k*1000:null,avgHr:h||null,src:'manuel',title:'Saisie manuelle'},[]);if(S.sample){S.acts=[];S.sample=false}merge([a]);save();route();toast('Séance ajoutée.')});
  document.addEventListener('dragover',e=>{const d=$('#drop');if(d){e.preventDefault();d.classList.add('over')}});
  document.addEventListener('dragleave',()=>{const d=$('#drop');if(d)d.classList.remove('over')});
  document.addEventListener('drop',e=>{const d=$('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFiles([...e.dataTransfer.files])}});
  window.addEventListener('hashchange',route);
  route();
  if(S.sync&&S.sync.pass&&(!S.sync.checked||Date.now()-S.sync.checked>20*6e4)){S.sync.checked=Date.now();syncGarmin(false)}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.sync&&S.sync.pass&&Date.now()-(S.sync.checked||0)>20*6e4){S.sync.checked=Date.now();syncGarmin(false)}});
  try{if('serviceWorker' in navigator&&/github\.io$|localhost|127\.0\.0\.1/.test(location.hostname))navigator.serviceWorker.register('sw.js')}catch(e){}
}
if(typeof window!=='undefined'&&window.document&&!window.__TEST__)boot();
if(typeof globalThis!=='undefined')globalThis.__allure={parseFIT,parseCSV,weekPlan,series,sampleActs,defProfile,monday,startDay,addDays,loadOf,merge,build,setS:s=>{S=s},getS:()=>S,stepsOf,bests,estimate,syncGarmin,wellToday};
}
</script>
